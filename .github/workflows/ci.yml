name: Verify reader

on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript and Astro
        run: npm run check
      - name: Validate editorial fixtures
        run: npm run validate
      - name: Run unit tests
        run: npm run test:unit
      - name: Build the local static demo
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run integration and accessibility tests
        run: npm run test:e2e
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reader-test-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

# This workflow never deploys, connects a domain, or uses Cloudflare credentials.
